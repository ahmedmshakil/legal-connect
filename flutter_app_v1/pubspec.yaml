name: flutter_app_v1
description: "Legal Connect - Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_markdown: ^0.7.4+3
  url_launcher: ^6.3.1

  # State Management & Navigation
  get: ^4.7.2

  # Network
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.3
  shared_preferences: ^2.3.4

  # Auth
  jwt_decoder: ^2.0.1

  # File handling
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  mime: ^2.0.0

  # WebSocket
  stomp_dart_client: ^2.0.0
  web_socket_channel: ^3.0.2

  # Utility
  uuid: ^4.5.1
  intl: ^0.20.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
